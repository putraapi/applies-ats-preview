<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Interview invitation — Dimas Rahman · Talent ATS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--text:#0F172A;--text-2:#334155;--muted:#475569;--primary:#0369A1;--primary-h:#075985;--on-primary:#FFFFFF;--soft:#E0F2FE;--soft-fg:#075985;--warn-bg:#FEF3C7;--warn-fg:#92400E;--bad-bg:#FEE2E2;--bad-fg:#991B1B;--ok-bg:#DCFCE7;--ok-fg:#166534;--ai-bg:#F3E8FF;--ai-fg:#6B21A8;--focus:#38BDF8;color-scheme:light}
.app.dark{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;color-scheme:dark}
@media (prefers-color-scheme:dark){.app.system{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;color-scheme:dark}}
a{color:var(--primary)}a:hover{color:var(--primary-h)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:15px;transition:background .15s ease}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--soft);color:var(--soft-fg);font-weight:600}
.b{cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s ease,border-color .15s ease}
.bp{background:var(--primary);color:var(--on-primary);border:0}.bp:hover{background:var(--primary-h);color:var(--on-primary)}
.bs{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}.bs:hover{background:var(--surface-2);color:var(--text)}
input,select,textarea{font-family:inherit}
input[type=radio]{width:18px;height:18px;accent-color:var(--primary)}
.fld{height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:14px;width:100%;box-sizing:border-box}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@media (max-width:820px){.nav{flex-direction:row!important;flex-wrap:wrap}.sfoot{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<template id="dc">

<div class="app {{themeClass}}" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">ATS</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px">Talent ATS</span>
        <span style="font-size: 12px; color: var(--muted)">Recruiter pilot · v1.2</span>
      </div>
    </div>
    <nav class="nav" aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
      <a href="index.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Vacancies</a>
      <a class="on" href="candidate.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21a6 6 0 0 0-4-5.6"></path></svg>Candidates</a>
      <a href="reports.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Reports</a>
      <a href="jd-bank.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg>JD Bank</a>
      <a href="backup.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg>Backup &amp; security</a>
    </nav>
    <button class="b bs" onClick="{{toggleTheme}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      {{themeLabel}}
    </button>
    <div class="sfoot" style="margin-top: auto; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; line-height: 1.4">
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #22C55E"></span>Local model online</span>
      <span>Data stays on this Mac (localhost)</span>
      <span>Last encrypted backup: today, 02:00</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 18px">

    <nav aria-label="Breadcrumb" style="font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px">
      <a href="pipeline.html" style="text-decoration: none; font-weight: 500">Penetration Tester</a><span aria-hidden="true">/</span>
      <a href="candidate.html" style="text-decoration: none; font-weight: 500">Dimas Rahman</a><span aria-hidden="true">/</span><span>Interview invitation</span>
    </nav>

    <header style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
          <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Invite Dimas Rahman</h1>
          <span style="font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2)">P1</span>
        </div>
        <p style="margin: 0; font-size: 15px; color: var(--muted)">Fill the template, then copy it or open it as a draft in your own mail app. The ATS sends nothing itself.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="b bs" onClick="{{copy}}" style="height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px">Copy text</button>
        <a class="b bp" href="{{mailto}}" style="height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
          Open email draft
        </a>
      </div>
    </header>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 10px; background: var(--ok-bg); color: var(--ok-fg); font-size: 14px">
        <span style="flex: 1">{{toast}}</span>
        <button class="b bs" onClick="{{dismiss}}" aria-label="Dismiss message" style="height: 34px; width: 34px; border-radius: 8px; font-size: 16px">×</button>
      </div>
    </sc-if>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

      <section aria-labelledby="d1" style="flex: 1 1 400px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <h2 id="d1" style="margin: 0; font-size: 16px; font-weight: 700">Details</h2>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="tpl" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Template</span>
          <div role="group" aria-labelledby="tpl" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px">
            <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
              <button class="b" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="flex: 1 1 auto; height: 38px; padding: 0 12px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 600; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px 16px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="date" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Date</label>
            <input id="date" class="fld" value="{{date}}" onInput="{{setDate}}">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="time" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Time (WIB)</label>
            <input id="time" class="fld" value="{{time}}" onInput="{{setTime}}">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="dur" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Duration</label>
            <x-select id="dur" class="fld" value="{{duration}}" onChange="{{setDuration}}">
              <x-option value="30 minutes">30 minutes</x-option>
              <x-option value="45 minutes">45 minutes</x-option>
              <x-option value="60 minutes">60 minutes</x-option>
              <x-option value="90 minutes">90 minutes</x-option>
            </x-select>
          </div>
        </div>

        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
          <legend style="font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 8px">Format</legend>
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
            <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid {{m.line}}; background: {{m.bg}}; cursor: pointer; font-size: 14px; font-weight: 600">
              <input type="radio" name="mode" checked="{{m.checked}}" onChange="{{m.pick}}">{{m.label}}
            </label>
          </sc-for>
        </fieldset>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="loc" style="font-size: 13px; font-weight: 600; color: var(--text-2)">{{locLabel}}</label>
          <input id="loc" class="fld" value="{{location}}" onInput="{{setLocation}}" placeholder="{{locPh}}">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="who" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Interviewers</label>
          <input id="who" class="fld" value="{{who}}" onInput="{{setWho}}">
          <span style="font-size: 12px; color: var(--muted)">Pre-filled from the requisition for this interview type.</span>
        </div>
      </section>

      <section aria-label="Email preview" style="flex: 1.2 1 440px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
        <dl style="margin: 0; padding: 14px 20px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 70px 1fr; gap: 8px 12px; font-size: 14px">
          <dt style="color: var(--muted)">To</dt><dd class="mono" style="margin: 0; font-size: 13px">dimas.rahman@example.com</dd>
          <dt style="color: var(--muted)">Subject</dt><dd style="margin: 0; font-weight: 600">{{subject}}</dd>
        </dl>
        <div style="padding: 20px; font-size: 14px; line-height: 1.7; white-space: pre-line; color: var(--text)">{{body}}</div>
      </section>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system","section":"Appearance"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      theme: null, type: 'Final Interview', date: 'Thursday, 12 Nov 2026', time: '10:00', duration: '60 minutes',
      mode: 'online', location: '', who: 'Ratna Sari (Head of Offensive Security)', toast: ''
    };
  }
  themeVals() {
    var self = this;
    var theme = this.state.theme || this.props.theme || 'system';
    var sysDark = false;
    try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    var isDark = theme === 'dark' || (theme === 'system' && sysDark);
    return {
      themeClass: theme, isDark: isDark, isLight: !isDark,
      themeLabel: isDark ? 'Light mode' : 'Dark mode',
      toggleTheme: function () { self.setState({ theme: isDark ? 'light' : 'dark' }); }
    };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var who = { 'HR Interview': 'Rani Puspita (Talent Acquisition)', 'Technical Interview': 'Andi Wirawan, Budi Hartono', 'Final Interview': 'Ratna Sari (Head of Offensive Security)' };
    var blurb = {
      'HR Interview': 'This is a conversation about your experience, motivation and expectations for the role.',
      'Technical Interview': 'Expect a technical discussion of your testing methodology and a walkthrough of a past engagement. Please have a laptop ready.',
      'Final Interview': 'You will meet the department head to talk about the role, the team and next steps.'
    };
    var online = s.mode === 'online';
    var place = s.location || (online ? '[meeting link]' : '[office address]');
    var subject = s.type + ' invitation — Penetration Tester, Entity A';
    var body = [
      'Dear Dimas,',
      '',
      'Thank you for your time so far in the Penetration Tester process at Entity A. We would like to invite you to the ' + s.type + '.',
      '',
      'Date: ' + s.date,
      'Time: ' + s.time + ' WIB (' + s.duration + ')',
      (online ? 'Online: ' : 'Location: ') + place,
      'With: ' + s.who,
      '',
      blurb[s.type],
      '',
      'Please reply to confirm, or suggest another time if this one does not suit you.',
      '',
      'Kind regards,',
      'Recruiter 1',
      'Talent Acquisition, Entity A'
    ].join('\n');
    var seg = function (on) { return on ? { bg: 'var(--surface)', fg: 'var(--text)', pressed: 'true' } : { bg: 'transparent', fg: 'var(--muted)', pressed: 'false' }; };
    var set = function (k) { return function (e) { var p = {}; p[k] = e.target.value; self.setState(p); }; };
    return Object.assign(this.themeVals(), {
      types: ['HR Interview', 'Technical Interview', 'Final Interview'].map(function (t) {
        return Object.assign({ label: t, pick: function () { self.setState({ type: t, who: who[t] }); } }, seg(s.type === t));
      }),
      modes: [['online', 'Online'], ['onsite', 'Onsite']].map(function (m) {
        var on = s.mode === m[0];
        return { label: m[1], checked: on, line: on ? 'var(--primary)' : 'var(--border-2)', bg: on ? 'var(--soft)' : 'var(--surface)',
          pick: function () { self.setState({ mode: m[0], location: '' }); } };
      }),
      date: s.date, time: s.time, duration: s.duration, location: s.location, who: s.who,
      setDate: set('date'), setTime: set('time'), setDuration: set('duration'), setLocation: set('location'), setWho: set('who'),
      locLabel: online ? 'Meeting link' : 'Office address',
      locPh: online ? 'Paste the Google Meet or Zoom link' : 'Building, floor and meeting room',
      subject: subject,
      body: body,
      mailto: 'mailto:dimas.rahman@example.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body),
      hasToast: !!s.toast, toast: s.toast,
      dismiss: function () { self.setState({ toast: '' }); },
      copy: function () {
        try { navigator.clipboard.writeText('Subject: ' + subject + '\n\n' + body); } catch (e) {}
        self.setState({ toast: 'Invitation copied to the clipboard.' });
      }
    });
  }
}
</script>
<div id="dc-root"></div>
<div role="note" style="position:fixed;right:12px;bottom:12px;z-index:50;padding:6px 12px;border-radius:999px;background:#0F172A;color:#F8FAFC;font:600 12px/1.4 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)">Design prototype · sample data</div>
<script src="dc-lite.js"></script>
</body>
</html>
