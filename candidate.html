<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Candidate — Dimas Rahman · Talent ATS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--text:#0F172A;--text-2:#334155;--muted:#475569;--primary:#0369A1;--primary-h:#075985;--on-primary:#FFFFFF;--soft:#E0F2FE;--soft-fg:#075985;--warn-bg:#FEF3C7;--warn-fg:#92400E;--bad-bg:#FEE2E2;--bad-fg:#991B1B;--ok-bg:#DCFCE7;--ok-fg:#166534;--ai-bg:#F3E8FF;--ai-fg:#6B21A8;--ai-line:#D8B4FE;--focus:#38BDF8;color-scheme:light}
.app.dark{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--ai-line:#6B3FA0;--focus:#7DD3FC;color-scheme:dark}
@media (prefers-color-scheme:dark){.app.system{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--ai-line:#6B3FA0;--focus:#7DD3FC;color-scheme:dark}}
a{color:var(--primary)}a:hover{color:var(--primary-h)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:15px;transition:background .15s ease}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--soft);color:var(--soft-fg);font-weight:600}
.b{cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s ease,border-color .15s ease}
.bp{background:var(--primary);color:var(--on-primary);border:0}.bp:hover{background:var(--primary-h);color:var(--on-primary)}
.bs{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}.bs:hover{background:var(--surface-2);color:var(--text)}
input,select,textarea{font-family:inherit}
.fld{height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:14px;width:100%;box-sizing:border-box}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@media (max-width:820px){.nav{flex-direction:row!important;flex-wrap:wrap}.sfoot{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<template id="dc">

<div class="app {{themeClass}}" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">ATS</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px">Talent ATS</span>
        <span style="font-size: 12px; color: var(--muted)">Recruiter pilot · v1.2</span>
      </div>
    </div>
    <nav class="nav" aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
      <a href="index.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Vacancies</a>
      <a class="on" href="candidate.html" aria-current="page"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21a6 6 0 0 0-4-5.6"></path></svg>Candidates</a>
      <a href="reports.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Reports</a>
      <a href="jd-bank.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg>JD Bank</a>
      <a href="backup.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg>Backup &amp; security</a>
    </nav>
    <button class="b bs" onClick="{{toggleTheme}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      {{themeLabel}}
    </button>
    <div class="sfoot" style="margin-top: auto; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; line-height: 1.4">
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #22C55E"></span>Local model online</span>
      <span>Data stays on this Mac (localhost)</span>
      <span>Last encrypted backup: today, 02:00</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 18px">

    <nav aria-label="Breadcrumb" style="font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px">
      <a href="index.html" style="text-decoration: none; font-weight: 500">Vacancies</a><span aria-hidden="true">/</span>
      <a href="pipeline.html" style="text-decoration: none; font-weight: 500">Penetration Tester</a><span aria-hidden="true">/</span><span>Dimas Rahman</span>
    </nav>

    <header style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <div aria-hidden="true" style="width: 56px; height: 56px; border-radius: 50%; background: var(--soft); color: var(--soft-fg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; flex: none">DR</div>
      <div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
          <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Dimas Rahman</h1>
          <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--soft-fg)">Technical Interview</span>
        </div>
        <p style="margin: 0; font-size: 14px; color: var(--text-2)">Security Consultant at Deloitte · Jakarta</p>
        <div style="display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted)">
          <span>Entity A (EA)</span><span>Applied 27 Oct 2026</span><span>Source: Referral</span><span>1 day in stage</span>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="b bs" style="height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px">Mark outcome</button>
        <a class="b bs" href="invitation.html" style="height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center">Invite to interview</a>
        <a class="b bs" href="mailto:?subject=Scorecard" style="height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px">
          <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
          Send scorecard
        </a>
        <button class="b bp" style="height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px">→ Final Interview</button>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

      <section aria-label="Original CV" style="flex: 1 1 340px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
          <h2 style="margin: 0; font-size: 15px; font-weight: 700">Original CV</h2>
          <span class="mono" style="font-size: 12px; color: var(--muted)">dimas_rahman_cv.pdf · 2 pp</span>
        </div>
        <div style="height: 720px; border-radius: 8px; border: 1px dashed var(--border-2); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; box-sizing: border-box">
          <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>
          [CV preview — clicking a quoted excerpt scrolls here and highlights it]
        </div>
      </section>

      <section style="flex: 1.4 1 480px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
        <div role="tablist" aria-label="Candidate details" style="display: flex; flex-wrap: wrap; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--border)">
          <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
            <button role="tab" class="b" aria-selected="{{tb.selected}}" onClick="{{tb.pick}}" style="min-height: 48px; padding: 0 2px; border: 0; border-bottom: 3px solid {{tb.line}}; background: transparent; color: {{tb.fg}}; font-weight: 600; font-size: 14px">{{tb.label}}</button>
          </sc-for>
        </div>

        <sc-if value="{{showAi}}" hint-placeholder-val="{{true}}">
          <div role="tabpanel" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--ai-bg); color: var(--ai-fg); font-size: 13px; line-height: 1.5">
              <strong style="font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase">AI-generated</strong>
              <span style="flex: 1 1 260px">Local model, checked against the frozen requirements of <span class="mono">JP-EA-SEC-004</span>. Evidence only — no score, no ranking. You decide.</span>
            </div>

            <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 10px">
                <h3 style="margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em">{{g.title}}</h3>
                <sc-for list="{{g.items}}" as="r" hint-placeholder-count="3">
                  <div style="border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
                    <div style="display: flex; gap: 10px; align-items: flex-start; justify-content: space-between">
                      <span style="font-size: 14px; font-weight: 600; line-height: 1.45">{{r.req}}</span>
                      <span style="flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}">
                        <span aria-hidden="true">{{r.icon}}</span>{{r.status}}
                      </span>
                    </div>
                    <sc-if value="{{r.hasQuote}}" hint-placeholder-val="{{true}}">
                      <blockquote style="margin: 0; padding: 8px 12px; border-left: 3px solid var(--ai-line); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13px; line-height: 1.55; color: var(--text-2)">“{{r.quote}}” <a href="#cv" style="font-size: 12px; font-weight: 600; white-space: nowrap">CV {{r.where}}</a></blockquote>
                    </sc-if>
                    <sc-if value="{{r.noQuote}}" hint-placeholder-val="{{false}}">
                      <span style="font-size: 13px; color: var(--muted)">No CV text found for this requirement. Ask about it in the interview.</span>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </sc-for>

            <div style="display: flex; flex-direction: column; gap: 8px">
              <h3 style="margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em">Suggested follow-up questions</h3>
              <ol style="margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.65; color: var(--text-2)">
                <li>Walk us through an executive summary you wrote for a non-technical client.</li>
                <li>Have you tested mobile apps or cloud environments (AWS, GCP, Azure)?</li>
                <li>Can you deliver reports in both English and Bahasa Indonesia?</li>
              </ol>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 14px; border-top: 1px solid var(--border)">
              <span style="font-size: 14px; font-weight: 600">Was this summary useful?</span>
              <button class="b bs" aria-pressed="{{usefulYes}}" onClick="{{rateYes}}" style="height: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; background: {{yesBg}}; border-color: {{yesLine}}">Useful</button>
              <button class="b bs" aria-pressed="{{usefulNo}}" onClick="{{rateNo}}" style="height: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; background: {{noBg}}; border-color: {{noLine}}">Not useful</button>
              <span style="font-size: 13px; color: var(--muted)">{{rateNote}}</span>
            </div>
            <p style="margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5">Photo, date of birth, age, gender, marital status and religion are removed before the model reads the CV. Hidden text and instructions inside the CV are ignored.</p>
          </div>
        </sc-if>

        <sc-if value="{{showProfile}}" hint-placeholder-val="{{false}}">
          <div role="tabpanel" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <p style="margin: 0; font-size: 13px; color: var(--muted)">Extracted from the CV. Any edit is written to the Change Log.</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 16px">
              <sc-for list="{{fields}}" as="f" hint-placeholder-count="8">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <label for="p{{$index}}" style="font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; gap: 6px; align-items: center">{{f.label}}
                    <sc-if value="{{f.edited}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--warn-bg); color: var(--warn-fg)">Edited · logged</span></sc-if>
                    <sc-if value="{{f.system}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted)">System</span></sc-if>
                  </label>
                  <input id="p{{$index}}" class="fld" defaultValue="{{f.value}}" readOnly="{{f.system}}" style="background: {{f.bg}}">
                </div>
              </sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <h3 style="margin: 0; font-size: 13px; font-weight: 700; color: var(--text-2)">Work history</h3>
              <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
                <li style="padding: 10px 12px; border-radius: 8px; background: var(--surface-2)"><strong>Security Consultant</strong> · Deloitte · 2022–present</li>
                <li style="padding: 10px 12px; border-radius: 8px; background: var(--surface-2)"><strong>IT Security Analyst</strong> · Bank Danamon · 2019–2022</li>
              </ul>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border)">
              <span style="flex: 1 1 260px; font-size: 14px"><strong>Cross-entity consent</strong> — may Entity B (EB) consider this candidate? <span style="color: var(--muted)">Not recorded</span></span>
              <button class="b bs" style="height: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600">Record consent</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{showScore}}" hint-placeholder-val="{{false}}">
          <div role="tabpanel" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <a class="b bp" href="mailto:?subject=Scorecard" style="height: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center">Send scorecard link</a>
              <button class="b bs" style="height: 40px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600">Import responses (CSV)</button>
              <span style="font-size: 13px; color: var(--muted); flex: 1 1 240px">The link carries only name, vacancy and stage. No CV or salary data.</span>
            </div>
            <sc-for list="{{scorecards}}" as="s" hint-placeholder-count="2">
              <article style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
                <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline; padding: 12px 14px; background: var(--surface-2)">
                  <strong style="font-size: 14px">{{s.stage}}</strong>
                  <span style="font-size: 13px; color: var(--muted)">{{s.summary}}</span>
                </div>
                <div style="overflow-x: auto">
                  <x-table style="width: 100%; min-width: 520px; border-collapse: collapse; font-size: 14px">
                    <x-thead><x-tr style="text-align: left; color: var(--muted); font-size: 12px">
                      <x-th style="padding: 10px 14px; font-weight: 600">Interviewer</x-th>
                      <sc-for list="{{s.criteria}}" as="cr" hint-placeholder-count="4"><x-th style="padding: 10px 8px; font-weight: 600; text-align: right">{{cr}}</x-th></sc-for>
                      <x-th style="padding: 10px 14px; font-weight: 700; text-align: right">Total</x-th>
                    </x-tr></x-thead>
                    <x-tbody>
                      <sc-for list="{{s.rows}}" as="row" hint-placeholder-count="2">
                        <x-tr style="border-top: 1px solid var(--border)">
                          <x-td style="padding: 10px 14px"><div style="font-weight: 600">{{row.who}}</div><div style="font-size: 12px; color: var(--muted)">{{row.meta}}</div></x-td>
                          <sc-for list="{{row.scores}}" as="sc" hint-placeholder-count="4"><x-td style="padding: 10px 8px; text-align: right; font-variant-numeric: tabular-nums; color: {{row.fg}}">{{sc}}</x-td></sc-for>
                          <x-td style="padding: 10px 14px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: {{row.fg}}">{{row.total}}</x-td>
                        </x-tr>
                      </sc-for>
                    </x-tbody>
                  </x-table>
                </div>
              </article>
            </sc-for>
            <p style="margin: 0; font-size: 12px; color: var(--muted)">Totals and averages are calculated by code, not AI. Interviewer email and submission time are kept as the audit record.</p>
          </div>
        </sc-if>

        <sc-if value="{{showHistory}}" hint-placeholder-val="{{false}}">
          <div role="tabpanel" style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted)">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
              Append-only. Stage Events and Change Log entries cannot be edited or deleted.
            </div>
            <ol style="list-style: none; margin: 0; padding: 0">
