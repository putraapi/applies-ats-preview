<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pipeline — Penetration Tester · Talent ATS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--text:#0F172A;--text-2:#334155;--muted:#475569;--primary:#0369A1;--primary-h:#075985;--on-primary:#FFFFFF;--soft:#E0F2FE;--soft-fg:#075985;--warn-bg:#FEF3C7;--warn-fg:#92400E;--bad-bg:#FEE2E2;--bad-fg:#991B1B;--ok-bg:#DCFCE7;--ok-fg:#166534;--ai-bg:#F3E8FF;--ai-fg:#6B21A8;--focus:#38BDF8;--col:#EEF2F6;color-scheme:light}
.app.dark{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;--col:#0E1627;color-scheme:dark}
@media (prefers-color-scheme:dark){.app.system{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;--col:#0E1627;color-scheme:dark}}
a{color:var(--primary)}a:hover{color:var(--primary-h)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:15px;transition:background .15s ease}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--soft);color:var(--soft-fg);font-weight:600}
.b{cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s ease,border-color .15s ease}
.bp{background:var(--primary);color:var(--on-primary);border:0}.bp:hover{background:var(--primary-h);color:var(--on-primary)}
.bs{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}.bs:hover{background:var(--surface-2);color:var(--text)}
.card{transition:border-color .15s ease}.card:hover{border-color:var(--border-2)}
.tab{min-height:44px;display:inline-flex;align-items:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tab:hover{color:var(--text)}.tab.on{color:var(--soft-fg);border-bottom-color:var(--primary)}
input,select,textarea{font-family:inherit}
input[type=radio]{width:18px;height:18px;accent-color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@media (max-width:820px){.nav{flex-direction:row!important;flex-wrap:wrap}.sfoot{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<template id="dc">

<div class="app {{themeClass}}" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">ATS</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px">Talent ATS</span>
        <span style="font-size: 12px; color: var(--muted)">Recruiter pilot · v1.2</span>
      </div>
    </div>
    <nav class="nav" aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
      <a class="on" href="index.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Vacancies</a>
      <a href="candidate.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21a6 6 0 0 0-4-5.6"></path></svg>Candidates</a>
      <a href="reports.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Reports</a>
      <a href="jd-bank.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg>JD Bank</a>
      <a href="backup.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg>Backup &amp; security</a>
    </nav>
    <button class="b bs" onClick="{{toggleTheme}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      {{themeLabel}}
    </button>
    <div class="sfoot" style="margin-top: auto; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; line-height: 1.4">
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #22C55E"></span>Local model online</span>
      <span>Data stays on this Mac (localhost)</span>
      <span>Last encrypted backup: today, 02:00</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 18px">

    <header style="display: flex; flex-direction: column; gap: 12px">
      <nav aria-label="Breadcrumb" style="font-size: 14px; color: var(--muted); display: flex; gap: 8px">
        <a href="index.html" style="text-decoration: none; font-weight: 500">Vacancies</a><span aria-hidden="true">/</span><span>Penetration Tester</span>
      </nav>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
            <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Penetration Tester</h1>
            <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--soft-fg)">Open</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); align-items: center">
            <span class="mono" style="font-size: 13px">JP-EA-SEC-004</span>
            <span>Entity A (EA)</span><span>Offensive Security</span><span>Open 18 days</span>
            <span style="font-weight: 700; color: var(--text)">Seats filled: {{filled}} of 2</span>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button class="b bs" style="height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px">Requisition PDF</button>
          <button class="b bs" style="height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px">Export vacancy</button>
          <button class="b bp" style="height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"></path></svg>
            Upload CVs
          </button>
        </div>
      </div>
      <nav aria-label="Vacancy sections" style="display: flex; flex-wrap: wrap; gap: 24px; border-bottom: 1px solid var(--border)">
        <a class="tab on" href="pipeline.html" aria-current="page">Pipeline</a>
        <a class="tab" href="#req">Requirements (frozen)</a>
        <a class="tab" href="#outcomes">Outcomes · {{outcomeCount}}</a>
        <a class="tab" href="offer-brief.html">Offer brief</a>
        <a class="tab" href="#history">Stage history</a>
      </nav>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border: 1.5px dashed var(--border-2); border-radius: 12px; background: var(--surface)">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"></path></svg>
      <span style="font-size: 14px; color: var(--text-2); flex: 1 1 280px">Drop PDF or DOCX CVs here — one or many. They land in <strong>Applied</strong> and process in the background.</span>
      <span style="font-size: 13px; color: var(--muted)">2 processing · 1 needs manual entry</span>
    </div>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 10px; background: {{toastBg}}; color: {{toastFg}}; font-size: 14px; line-height: 1.5">
        <span style="flex: 1 1 300px">{{toastMsg}}</span>
        <sc-if value="{{toastHasAction}}" hint-placeholder-val="{{false}}">
          <button class="b bs" onClick="{{toastAction}}" style="height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600">{{toastActionLabel}}</button>
        </sc-if>
        <button class="b bs" onClick="{{dismissToast}}" aria-label="Dismiss message" style="height: 36px; width: 36px; border-radius: 8px; font-size: 16px; font-weight: 600">×</button>
      </div>
    </sc-if>

    <sc-if value="{{outcomeOpen}}" hint-placeholder-val="{{false}}">
      <section role="dialog" aria-labelledby="oh" style="padding: 20px; border-radius: 12px; background: var(--surface); border: 2px solid var(--primary); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap">
          <h2 id="oh" style="margin: 0; font-size: 17px; font-weight: 700">Mark outcome — {{ocName}}</h2>
          <span style="font-size: 13px; color: var(--muted)">Currently in {{ocStage}}</span>
        </div>
        <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
          <legend style="font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 8px">Outcome</legend>
          <sc-for list="{{ocOptions}}" as="o" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid {{o.line}}; background: {{o.bg}}; cursor: pointer; font-size: 14px; font-weight: 600">
              <input type="radio" name="oc" checked="{{o.checked}}" onChange="{{o.pick}}">{{o.label}}
              <span style="font-weight: 400; color: var(--muted); font-size: 13px">{{o.hint}}</span>
            </label>
          </sc-for>
        </fieldset>
        <div style="display: flex; flex-direction: column; gap: 6px; max-width: 440px">
          <label for="reason" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Reason (required)</label>
          <x-select id="reason" value="{{ocReason}}" onChange="{{pickReason}}" style="height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface); color: var(--text); font-size: 14px">
            <x-option value="">Choose a reason…</x-option>
            <sc-for list="{{ocReasons}}" as="rs" hint-placeholder-count="4"><x-option value="{{rs}}">{{rs}}</x-option></sc-for>
          </x-select>
        </div>
        <p style="margin: 0; font-size: 13px; color: var(--muted)">The card leaves the board. The candidate record and full history stay, and the outcome feeds the drop-off report.</p>
        <div style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap">
          <button class="b bs" onClick="{{cancelOutcome}}" style="height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px">Cancel</button>
          <button class="b bp" onClick="{{confirmOutcome}}" disabled="{{ocDisabled}}" style="height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 14px; opacity: {{ocOpacity}}">Confirm outcome</button>
        </div>
      </section>
    </sc-if>

    <div style="overflow-x: auto; padding-bottom: 8px">
      <div style="display: flex; gap: 12px; align-items: flex-start; min-width: min-content">
        <sc-for list="{{columns}}" as="col" hint-placeholder-count="6">
          <section aria-label="{{col.name}}, {{col.count}} candidates" style="width: 256px; flex: none; background: var(--col); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; align-items: center; gap: 6px; padding: 4px 4px 2px">
              <sc-if value="{{col.locked}}" hint-placeholder-val="{{false}}">
                <svg role="img" aria-label="Locked stage" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
              </sc-if>
              <h2 style="margin: 0; font-size: 13px; font-weight: 700">{{col.name}}</h2>
              <span style="margin-left: auto; font-size: 12px; font-weight: 700; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px">{{col.count}}</span>
            </div>
            <sc-if value="{{col.note}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; color: var(--muted); padding: 0 4px">{{col.noteText}}</span>
            </sc-if>
            <sc-if value="{{col.empty}}" hint-placeholder-val="{{false}}">
              <p style="margin: 0; padding: 14px 8px; border: 1px dashed var(--border-2); border-radius: 8px; text-align: center; font-size: 12px; color: var(--muted)">No one here</p>
            </sc-if>
            <sc-for list="{{col.items}}" as="c" hint-placeholder-count="2">
              <article class="card" style="background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
                <div style="display: flex; flex-direction: column; gap: 2px">
                  <a href="candidate.html" style="font-weight: 600; font-size: 15px; color: var(--text); text-decoration: none">{{c.name}}</a>
                  <span style="font-size: 12px; color: var(--muted)">{{c.current}}</span>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: {{c.aiBg}}; color: {{c.aiFg}}">{{c.ai}}</span>
                  <sc-if value="{{c.hasScore}}" hint-placeholder-val="{{false}}">
                    <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: {{c.scBg}}; color: {{c.scFg}}">Scorecards {{c.scText}}</span>
                  </sc-if>
                  <sc-if value="{{c.dup}}" hint-placeholder-val="{{false}}">
                    <span style="font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: var(--warn-bg); color: var(--warn-fg)">Possible duplicate</span>
                  </sc-if>
                </div>
                <div style="display: flex; gap: 8px; font-size: 12px; color: var(--muted)">
                  <span>{{c.source}}</span>
                  <span style="margin-left: auto; color: {{c.ageFg}}; font-weight: {{c.ageW}}">{{c.ageText}}</span>
                </div>
                <div style="display: flex; gap: 6px; border-top: 1px solid var(--border); padding-top: 8px">
                  <button class="b bs" onClick="{{c.openOutcome}}" aria-label="Mark outcome for {{c.name}}" style="height: 34px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 600">Outcome</button>
                  <sc-if value="{{c.canAdvance}}" hint-placeholder-val="{{true}}">
                    <button class="b bs" onClick="{{c.advance}}" aria-label="Move {{c.name}} to {{c.nextName}}" style="flex: 1; min-width: 0; height: 34px; padding: 0 8px; border-radius: 7px; border-color: var(--primary); color: var(--soft-fg); font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">→ {{c.nextName}}</button>
                  </sc-if>
                </div>
              </article>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; color: var(--muted)">Drag cards between columns, or use the buttons — both write a Stage Event. User Interview is switched off for this vacancy by the requisition form.</p>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system","section":"Appearance"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      theme: null,
      toast: null,
      oc: null,
      cands: [
        { id: 1, name: 'Arif Hidayat', current: 'Security Analyst · Telkomsigma', source: 'LinkedIn', days: 0, stage: 0, ai: 'proc', sc: 0 },
        { id: 2, name: 'Sari Putri', current: 'Junior Pentester · Freelance', source: 'Job portal', days: 0, stage: 0, ai: 'proc', sc: 0 },
        { id: 3, name: 'Bagus Santoso', current: 'IT Auditor · Bank BRI', source: 'Referral', days: 1, stage: 0, ai: 'ready', sc: 0, dup: true },
        { id: 4, name: 'Rizky Ananda', current: 'Network Engineer · Indosat', source: 'Job portal', days: 2, stage: 1, ai: 'manual', sc: 0 },
        { id: 5, name: 'Fitri Handayani', current: 'AppSec Engineer · Tiket.com', source: 'LinkedIn', days: 1, stage: 1, ai: 'ready', sc: 0 },
        { id: 6, name: 'Teguh Prakoso', current: 'Red Team · Bank Mandiri', source: 'Referral', days: 4, stage: 2, ai: 'ready', sc: 0 },
        { id: 7, name: 'Lina Marlina', current: 'Pentester · Consultant', source: 'LinkedIn', days: 2, stage: 3, ai: 'ready', sc: 0 },
        { id: 8, name: 'Dimas Rahman', current: 'Security Consultant · Deloitte', source: 'Referral', days: 1, stage: 4, ai: 'ready', sc: 1 },
        { id: 9, name: 'Hendra Gunawan', current: 'Sr. Pentester · Xynexis', source: 'LinkedIn', days: 3, stage: 5, ai: 'ready', sc: 2 },
        { id: 10, name: 'Kevin Halim', current: 'Offensive Lead · Startup', source: 'Referral', days: 2, stage: 8, ai: 'ready', sc: 0 }
      ],
      outcomes: 4
    };
  }
  themeVals() {
    var self = this;
    var theme = this.state.theme || this.props.theme || 'system';
    var sysDark = false;
    try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    var isDark = theme === 'dark' || (theme === 'system' && sysDark);
    return {
      themeClass: theme, isDark: isDark, isLight: !isDark,
      themeLabel: isDark ? 'Light mode' : 'Dark mode',
      toggleTheme: function () { self.setState({ theme: isDark ? 'light' : 'dark' }); }
    };
  }
  renderVals() {
    var self = this;
    var stages = ['Applied', 'Screening', 'HR Interview', 'Technical Assessment', 'Technical Interview', 'Final Interview',
      'Background Checking', 'Reference Checking', 'Salary Approval', 'Offering & Negotiation', 'Agreement', 'MCU', 'Hired'];
    var locked = { 0: true, 10: true, 12: true };
    var interview = { 2: 1, 4: 2, 5: 2 };
    var AGREE = 10, SEATS = 2;
    var cands = this.state.cands.filter(function (c) { return !c.out; });
    var filled = cands.filter(function (c) { return c.stage >= AGREE; }).length;
    var now = '9 Nov 2026, 10:42';

    var doMove = function (c, si) {
      var from = stages[si], to = stages[si + 1];
      var msg = 'Stage Event logged — ' + c.name + ': ' + from + ' → ' + to + ' · ' + now + '.';
      var tone = 'ok';
      if (interview[si] && c.sc < interview[si]) { msg += ' No scorecard yet for ' + from + ' — moved anyway; follow up with the interviewer.'; tone = 'warn'; }
      if (si + 1 === AGREE) msg += ' Seat ' + (filled + 1) + ' of ' + SEATS + ' filled; Time to Hire recorded.';
      self.setState({
        cands: self.state.cands.map(function (x) { return x.id === c.id ? Object.assign({}, x, { stage: si + 1, days: 0, sc: 0 }) : x; }),
        toast: { msg: msg, tone: tone }
      });
    };

    var columns = stages.map(function (name, si) {
      var items = cands.filter(function (c) { return c.stage === si; }).map(function (c) {
        var need = interview[si] || 0;
        var aiMap = { proc: ['Parsing…', 'var(--surface-2)', 'var(--muted)'], ready: ['AI summary ready', 'var(--ai-bg)', 'var(--ai-fg)'], manual: ['Manual entry needed', 'var(--bad-bg)', 'var(--bad-fg)'] };
        var a = aiMap[c.ai];
        var stale = c.days >= 3;
        return Object.assign({}, c, {
          ai: a[0], aiBg: a[1], aiFg: a[2],
          hasScore: need > 0, scText: c.sc + '/' + need,
          scBg: c.sc >= need ? 'var(--ok-bg)' : 'var(--surface-2)', scFg: c.sc >= need ? 'var(--ok-fg)' : 'var(--text-2)',
          ageText: stale ? 'No update ' + c.days + 'd' : (c.days === 0 ? 'Today' : c.days + 'd in stage'),
          ageFg: stale ? 'var(--warn-fg)' : 'var(--muted)', ageW: stale ? '700' : '500',
          canAdvance: si < stages.length - 1,
          nextName: stages[si + 1] || '',
          advance: function () {
            if (si + 1 === AGREE && filled >= SEATS) {
              self.setState({ toast: { msg: 'All ' + SEATS + ' seats are already filled. Moving ' + c.name + ' into Agreement over-fills the vacancy and needs a reason.', tone: 'bad', action: 'Confirm with reason', run: function () { doMove(c, si); } } });
              return;
            }
            doMove(c, si);
          },
          openOutcome: function () { self.setState({ oc: { id: c.id, name: c.name, stage: si, choice: 'Rejected', reason: '' } }); }
        });
      });
      return {
        name: name, items: items, count: items.length, empty: items.length === 0, locked: !!locked[si],
        note: si === AGREE || si === 12, noteText: si === AGREE ? 'Ends Time to Hire · fills a seat' : 'Final stage'
      };
    });

    var oc = this.state.oc;
    var reasonsBy = {
      'Rejected': ['Does not meet must-have requirements', 'Weaker than other finalists', 'Failed technical assessment', 'Salary expectation out of range'],
      'Withdrawn': ['Accepted another offer', 'Not responding', 'Personal reasons', 'Location or work arrangement'],
      'Offer Declined': ['Compensation', 'Counter-offer from current employer', 'Role scope', 'Start date'],
      'Failed Post-Agreement': ['Did not pass MCU', 'Background check finding', 'Did not join on start date']
    };
    var ocOptions = [], ocReasons = [];
    if (oc) {
      var opts = [['Rejected', 'company ends'], ['Withdrawn', 'candidate ends']];
      if (oc.stage >= 9) opts.push(['Offer Declined', 'candidate declines offer']);
      if (oc.stage >= AGREE) opts.push(['Failed Post-Agreement', 'seat reopens']);
      ocOptions = opts.map(function (o) {
        var on = oc.choice === o[0];
        return { label: o[0], hint: o[1], checked: on, line: on ? 'var(--primary)' : 'var(--border-2)', bg: on ? 'var(--soft)' : 'var(--surface)',
          pick: function () { self.setState({ oc: Object.assign({}, self.state.oc, { choice: o[0], reason: '' }) }); } };
      });
      ocReasons = reasonsBy[oc.choice] || [];
    }
    var t = this.state.toast;
    var tones = { ok: ['var(--ok-bg)', 'var(--ok-fg)'], warn: ['var(--warn-bg)', 'var(--warn-fg)'], bad: ['var(--bad-bg)', 'var(--bad-fg)'] };
    var tt = t ? tones[t.tone] : tones.ok;

    return Object.assign(this.themeVals(), {
      columns: columns,
      filled: filled,
      outcomeCount: this.state.outcomes,
      hasToast: !!t, toastMsg: t ? t.msg : '', toastBg: tt[0], toastFg: tt[1],
      toastHasAction: !!(t && t.action), toastActionLabel: t && t.action ? t.action : '',
      toastAction: function () { if (t && t.run) t.run(); },
      dismissToast: function () { self.setState({ toast: null }); },
      outcomeOpen: !!oc,
      ocName: oc ? oc.name : '', ocStage: oc ? stages[oc.stage] : '',
      ocOptions: ocOptions, ocReasons: ocReasons, ocReason: oc ? oc.reason : '',
      ocDisabled: !(oc && oc.reason), ocOpacity: oc && oc.reason ? '1' : '0.5',
      pickReason: function (e) { self.setState({ oc: Object.assign({}, self.state.oc, { reason: e.target.value }) }); },
      cancelOutcome: function () { self.setState({ oc: null }); },
      confirmOutcome: function () {
        var o = self.state.oc; if (!o || !o.reason) return;
        self.setState({
          cands: self.state.cands.map(function (x) { return x.id === o.id ? Object.assign({}, x, { out: o.choice }) : x; }),
          outcomes: self.state.outcomes + 1,
          oc: null,
          toast: { msg: o.name + ' marked ' + o.choice + ' (' + o.reason + ') at ' + stages[o.stage] + '. Record and history kept.', tone: 'ok', action: 'Undo', run: function () {
            self.setState({ cands: self.state.cands.map(function (x) { return x.id === o.id ? Object.assign({}, x, { out: null }) : x; }), outcomes: self.state.outcomes - 1, toast: null });
          } }
        });
      }
    });
  }
}
</script>
<div id="dc-root"></div>
<div role="note" style="position:fixed;right:12px;bottom:12px;z-index:50;padding:6px 12px;border-radius:999px;background:#0F172A;color:#F8FAFC;font:600 12px/1.4 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)">Design prototype · sample data</div>
<script src="dc-lite.js"></script>
