<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JD Bank · Talent ATS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--text:#0F172A;--text-2:#334155;--muted:#475569;--primary:#0369A1;--primary-h:#075985;--on-primary:#FFFFFF;--soft:#E0F2FE;--soft-fg:#075985;--warn-bg:#FEF3C7;--warn-fg:#92400E;--bad-bg:#FEE2E2;--bad-fg:#991B1B;--ok-bg:#DCFCE7;--ok-fg:#166534;--ai-bg:#F3E8FF;--ai-fg:#6B21A8;--focus:#38BDF8;color-scheme:light}
.app.dark{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;color-scheme:dark}
@media (prefers-color-scheme:dark){.app.system{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;color-scheme:dark}}
a{color:var(--primary)}a:hover{color:var(--primary-h)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:15px;transition:background .15s ease}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--soft);color:var(--soft-fg);font-weight:600}
.b{cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s ease,border-color .15s ease}
.bp{background:var(--primary);color:var(--on-primary);border:0}.bp:hover{background:var(--primary-h);color:var(--on-primary)}
.bp:disabled{background:var(--border-2);color:var(--muted);cursor:not-allowed}
.bs{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}.bs:hover{background:var(--surface-2);color:var(--text)}
.row:hover{background:var(--surface-2)}
.rowbtn{all:unset;cursor:pointer;display:block;font-weight:600;font-size:15px;color:var(--text)}
.rowbtn:hover{color:var(--primary)}
.rowbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
input,select,textarea{font-family:inherit}
.fld{height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:14px;width:100%;box-sizing:border-box}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
@media (max-width:820px){.nav{flex-direction:row!important;flex-wrap:wrap}.sfoot{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<template id="dc">

<div class="app {{themeClass}}" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">ATS</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px">Talent ATS</span>
        <span style="font-size: 12px; color: var(--muted)">Recruiter pilot · v1.2</span>
      </div>
    </div>
    <nav class="nav" aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
      <a href="index.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Vacancies</a>
      <a href="candidate.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21a6 6 0 0 0-4-5.6"></path></svg>Candidates</a>
      <a href="reports.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Reports</a>
      <a class="on" href="jd-bank.html" aria-current="page"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg>JD Bank</a>
      <a href="backup.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg>Backup &amp; security</a>
    </nav>
    <button class="b bs" onClick="{{toggleTheme}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      {{themeLabel}}
    </button>
    <div class="sfoot" style="margin-top: auto; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; line-height: 1.4">
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #22C55E"></span>Local model online</span>
      <span>Data stays on this Mac (localhost)</span>
      <span>Last encrypted backup: today, 02:00</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px) 40px; display: flex; flex-direction: column; gap: 20px">

    <header style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">JD Bank</h1>
        <p style="margin: 0; font-size: 15px; color: var(--muted); max-width: 720px">Job descriptions read by label from the JD Bank folder. Open vacancies keep a frozen snapshot, so changes here never affect candidates already being assessed.</p>
      </div>
      <button class="b bp" onClick="{{rescan}}" style="height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
        Re-scan folder
      </button>
    </header>

    <section aria-label="Import summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; color: var(--muted); font-weight: 500">{{t.label}}</span>
          <span style="font-size: 26px; font-weight: 700; color: {{t.fg}}; font-variant-numeric: tabular-nums">{{t.value}}</span>
          <span style="font-size: 12px; color: var(--muted)">{{t.sub}}</span>
        </div>
      </sc-for>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

      <section aria-labelledby="lst" style="flex: 3 1 520px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
        <div style="padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
          <h2 id="lst" style="margin: 0 8px 0 0; font-size: 16px; font-weight: 700">Documents</h2>
          <div role="group" aria-label="Filter" style="display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px">
            <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
              <button class="b" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="height: 34px; padding: 0 12px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 600; background: {{f.bg}}; color: {{f.fg}}">{{f.label}} <span style="opacity: 0.75">{{f.count}}</span></button>
            </sc-for>
          </div>
        </div>
        <div style="overflow-x: auto">
          <x-table style="width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14px">
            <x-thead><x-tr style="text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
              <x-th style="padding: 10px 20px; font-weight: 600">Role</x-th><x-th style="padding: 10px 12px; font-weight: 600">Job Profile Code</x-th><x-th style="padding: 10px 12px; font-weight: 600">Entity</x-th><x-th style="padding: 10px 20px; font-weight: 600">Status</x-th>
            </x-tr></x-thead>
            <x-tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
                <x-tr class="row" style="border-top: 1px solid var(--border); background: {{r.rowBg}}">
                  <x-td style="padding: 12px 20px">
                    <button class="rowbtn" onClick="{{r.pick}}" aria-pressed="{{r.selected}}">{{r.title}}</button>
                    <div style="font-size: 12px; color: var(--muted); margin-top: 2px">{{r.dept}} · <span class="mono">{{r.file}}</span></div>
                  </x-td>
                  <x-td class="mono" style="padding: 12px; font-size: 13px; white-space: nowrap; color: {{r.codeFg}}">{{r.codeText}}</x-td>
                  <x-td style="padding: 12px; color: var(--text-2)">{{r.entity}}</x-td>
                  <x-td style="padding: 12px 20px"><span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: {{r.sBg}}; color: {{r.sFg}}; white-space: nowrap">{{r.statusText}}</span></x-td>
                </x-tr>
              </sc-for>
            </x-tbody>
          </x-table>
        </div>
      </section>

      <section aria-labelledby="det" style="flex: 2 1 340px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h2 id="det" style="margin: 0; font-size: 18px; font-weight: 700">{{sel.title}}</h2>
          <span style="font-size: 13px; color: var(--muted)">{{sel.dept}} · {{sel.entity}} · file dated {{sel.date}}</span>
        </div>

        <sc-if value="{{sel.flagged}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: var(--bad-bg); color: var(--bad-fg); font-size: 14px; line-height: 1.5">
            <strong>{{sel.issueTitle}}</strong>
            <span>{{sel.issue}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="fix" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Job Profile Code</label>
            <input id="fix" class="fld mono" value="{{fixValue}}" onInput="{{typeFix}}" placeholder="JP-EA-SEC-010" aria-describedby="fixhelp" style="border-color: {{fixLine}}; border-width: 2px">
            <span id="fixhelp" style="font-size: 12px; font-weight: 600; color: {{fixFg}}">{{fixMsg}}</span>
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <button class="b bp" onClick="{{saveFix}}" disabled="{{fixInvalid}}" style="height: 42px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 14px">Save &amp; import</button>
            <button class="b bs" style="height: 42px; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 14px">Open source file</button>
          </div>
        </sc-if>

        <sc-if value="{{sel.ok}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px">
            <span class="mono" style="font-weight: 500; padding: 4px 10px; border-radius: 6px; background: var(--surface-2)">{{sel.code}}</span>
            <span style="color: var(--muted); font-size: 13px">Used by {{sel.uses}}</span>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <h3 style="margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em">Must-have</h3>
          <ul style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; color: var(--text-2)">
            <sc-for list="{{sel.must}}" as="m" hint-placeholder-count="3"><li>{{m}}</li></sc-for>
          </ul>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h3 style="margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em">Nice-to-have</h3>
          <sc-if value="{{sel.hasNice}}" hint-placeholder-val="{{true}}">
            <ul style="margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; color: var(--text-2)">
              <sc-for list="{{sel.nice}}" as="n" hint-placeholder-count="2"><li>{{n}}</li></sc-for>
            </ul>
          </sc-if>
          <sc-if value="{{sel.noNice}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 13px; color: var(--warn-fg); font-weight: 600">Section not found in the document.</span>
          </sc-if>
        </div>
        <p style="margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5">Code format: <span class="mono">JP-[company]-[department]-[3-digit sequence]</span>. Codes identify a profile only; entity and department are always read from their own fields, and codes are never reused.</p>
      </section>
    </div>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system","section":"Appearance"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      theme: null, filter: 'all', sel: 8, fix: {}, fixed: {},
      docs: [
        { id: 1, title: 'Penetration Tester', dept: 'Offensive Security', entity: 'EA', code: 'JP-EA-SEC-004', file: 'JD_Penetration_Tester.docx', date: '14 Aug 2026', uses: '1 open vacancy',
          must: ['2+ years in web or network penetration testing', 'OSCP or equivalent hands-on certification', 'Writes clear technical and executive reports'], nice: ['Mobile or cloud security testing', 'Public CVEs or bug bounty record'] },
        { id: 2, title: 'SOC Analyst L1', dept: 'Security Operations', entity: 'EA', code: 'JP-EA-SOC-011', file: 'JD_SOC_Analyst_L1.docx', date: '02 Jul 2026', uses: '1 open vacancy',
          must: ['Monitors SIEM alerts in 24/7 shifts', 'Basic networking and log analysis'], nice: ['Security+ or equivalent'] },
        { id: 3, title: 'HR Generalist', dept: 'Human Capital', entity: 'EA', code: 'JP-EA-HG-003', file: 'JD_HR_Generalist.docx', date: '20 May 2026', uses: '1 open vacancy',
          must: ['2+ years in end-to-end HR operations', 'Working knowledge of Indonesian labour law'], nice: ['HRIS administration'] },
        { id: 4, title: 'Data Analyst', dept: 'Business Intelligence', entity: 'EA', code: 'JP-EA-BI-007', file: 'JD_Data_Analyst.docx', date: '11 Jun 2026', uses: '1 open vacancy',
          must: ['SQL and one BI tool', 'Communicates findings to non-technical teams'], nice: ['Python for analysis'] },
        { id: 5, title: 'Cybersecurity Trainer', dept: 'Academy', entity: 'EB', code: 'JP-EB-ACD-002', file: 'JD_Cybersecurity_Trainer.docx', date: '03 Sep 2026', uses: '1 open vacancy',
          must: ['Delivers hands-on security training', 'Industry certification (e.g. CEH, OSCP)'], nice: ['Curriculum design experience'] },
        { id: 6, title: 'Curriculum Developer', dept: 'Academy', entity: 'EB', code: 'JP-EB-ACD-005', file: 'JD_Curriculum_Developer.docx', date: '03 Sep 2026', uses: '1 postponed vacancy',
          must: ['Designs modular technical courses', 'Writes assessment rubrics'], nice: ['LMS administration'] },
        { id: 7, title: 'Lab Assistant', dept: 'Academy', entity: 'EB', code: 'JP-EB-ACD-002', file: 'JD_Lab_Assistant.docx', date: '28 Oct 2026', issue: 'dup',
          must: ['Prepares and resets training lab environments'], nice: ['Virtualisation basics'] },
        { id: 8, title: 'SOC Analyst L2', dept: 'Security Operations', entity: 'EA', code: 'JP-EA-SOC-11', file: 'JD_SOC_Analyst_L2.docx', date: '30 Oct 2026', issue: 'malformed',
          must: ['Investigates escalated incidents', 'Threat hunting with EDR tooling'], nice: ['GCIH or equivalent'] },
        { id: 9, title: 'IT Support Officer', dept: 'IT', entity: 'EA', code: '', file: 'JD_IT_Support_Officer.docx', date: '05 Nov 2026', issue: 'missing',
          must: ['Supports employee laptops and accounts', 'Basic macOS and Google Workspace administration'], nice: ['ITIL Foundation'] },
        { id: 10, title: 'Cloud Security Engineer', dept: 'Offensive Security', entity: 'EA', code: 'JP-EA-SEC-009', file: 'JD_Cloud_Security_Engineer.docx', date: '19 Jul 2026', uses: '1 cancelled vacancy',
          must: ['Secures AWS or GCP workloads', 'Infrastructure as code reviews'], nice: [] }
      ]
    };
  }
  themeVals() {
    var self = this;
    var theme = this.state.theme || this.props.theme || 'system';
    var sysDark = false;
    try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    var isDark = theme === 'dark' || (theme === 'system' && sysDark);
    return {
      themeClass: theme, isDark: isDark, isLight: !isDark,
      themeLabel: isDark ? 'Light mode' : 'Dark mode',
      toggleTheme: function () { self.setState({ theme: isDark ? 'light' : 'dark' }); }
    };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var docs = st.docs.map(function (d) { return st.fixed[d.id] ? Object.assign({}, d, { code: st.fixed[d.id], issue: null, uses: 'no vacancies yet' }) : d; });
    var issues = {
      dup: ['Duplicate code', 'This code is already used by Cybersecurity Trainer. Codes are never reused — give this profile a new sequence number.'],
      malformed: ['Malformed code', 'The sequence must be exactly 3 digits, for example JP-EA-SOC-011.'],
      missing: ['Missing code', 'No “Job Profile Code” field was found in the document’s information table. Enter one, or fix the document and re-scan.']
    };
    var flaggedCount = docs.filter(function (d) { return d.issue; }).length;
    var f = st.filter;
    var shown = docs.filter(function (d) { return f === 'all' || (f === 'flagged' ? d.issue : !d.issue); });
    var sel = docs.filter(function (d) { return d.id === st.sel; })[0] || docs[0];
    var usedCodes = docs.filter(function (d) { return !d.issue && d.id !== sel.id; }).map(function (d) { return d.code; });
    var fixValue = st.fix[sel.id] != null ? st.fix[sel.id] : sel.code;
    var entityName = { EA: 'Entity A (EA)', EB: 'Entity B (EB)' };
    var pattern = new RegExp('^JP-(' + Object.keys(entityName).join('|') + ')-[A-Z]{2,4}-\\d{3}$');
    var fixMsg, fixOk = false;
    if (!fixValue) fixMsg = 'Enter a code to continue.';
    else if (!pattern.test(fixValue)) fixMsg = 'Use the format JP-EA-ABC-001.';
    else if (usedCodes.indexOf(fixValue) >= 0) fixMsg = 'Already used by another profile.';
    else if (fixValue.indexOf('JP-' + sel.entity + '-') !== 0) fixMsg = 'Company part does not match the entity (' + sel.entity + ').';
    else { fixMsg = 'Looks good — this code is free.'; fixOk = true; }
    var seg = function (on) { return on ? { bg: 'var(--surface)', fg: 'var(--text)', pressed: 'true' } : { bg: 'transparent', fg: 'var(--muted)', pressed: 'false' }; };
    return Object.assign(this.themeVals(), {
      tiles: [
        { label: 'Documents scanned', value: String(docs.length), sub: 'Last scan today, 08:30', fg: 'var(--text)' },
        { label: 'Imported', value: String(docs.length - flaggedCount), sub: 'Code, title, department and both lists read', fg: 'var(--ok-fg)' },
        { label: 'Flagged', value: String(flaggedCount), sub: 'Missing, malformed or duplicate code', fg: flaggedCount ? 'var(--bad-fg)' : 'var(--ok-fg)' },
        { label: 'Sections missing', value: '1', sub: 'Imported, but a requirement list is empty', fg: 'var(--warn-fg)' }
      ],
      filters: [['all', 'All', docs.length], ['flagged', 'Flagged', flaggedCount], ['ok', 'Imported', docs.length - flaggedCount]].map(function (x) {
        return Object.assign({ label: x[1], count: x[2], pick: function () { self.setState({ filter: x[0] }); } }, seg(f === x[0]));
      }),
      rows: shown.map(function (d) {
        var on = d.id === sel.id;
        var flag = !!d.issue;
        var partial = !flag && d.nice.length === 0;
        return {
          title: d.title, dept: d.dept, file: d.file, entity: d.entity,
          codeText: d.code || '— none —', codeFg: flag ? 'var(--bad-fg)' : 'var(--text-2)',
          statusText: flag ? issues[d.issue][0] : (partial ? 'Imported · section missing' : 'Imported'),
          sBg: flag ? 'var(--bad-bg)' : (partial ? 'var(--warn-bg)' : 'var(--ok-bg)'),
          sFg: flag ? 'var(--bad-fg)' : (partial ? 'var(--warn-fg)' : 'var(--ok-fg)'),
          rowBg: on ? 'var(--soft)' : 'transparent', selected: on ? 'true' : 'false',
          pick: function () { self.setState({ sel: d.id }); }
        };
      }),
      sel: {
        title: sel.title, dept: sel.dept, entity: entityName[sel.entity], date: sel.date, code: sel.code, uses: sel.uses || '—',
        flagged: !!sel.issue, ok: !sel.issue,
        issueTitle: sel.issue ? issues[sel.issue][0] : '', issue: sel.issue ? issues[sel.issue][1] : '',
        must: sel.must, nice: sel.nice, hasNice: sel.nice.length > 0, noNice: sel.nice.length === 0
      },
      fixValue: fixValue, fixMsg: fixMsg, fixInvalid: !fixOk,
      fixFg: fixOk ? 'var(--ok-fg)' : 'var(--bad-fg)', fixLine: fixOk ? 'var(--ok-fg)' : 'var(--bad-fg)',
      typeFix: function (e) { var x = Object.assign({}, self.state.fix); x[sel.id] = e.target.value.toUpperCase(); self.setState({ fix: x }); },
      saveFix: function () { if (!fixOk) return; var x = Object.assign({}, self.state.fixed); x[sel.id] = fixValue; self.setState({ fixed: x }); },
      rescan: function () { self.setState({ filter: 'all' }); }
    });
  }
}
</script>

<script src="dc-lite.js"></script>
