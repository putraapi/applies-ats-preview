<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reports · Talent ATS prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F1F5F9;--border:#E2E8F0;--border-2:#CBD5E1;--text:#0F172A;--text-2:#334155;--muted:#475569;--primary:#0369A1;--primary-h:#075985;--on-primary:#FFFFFF;--soft:#E0F2FE;--soft-fg:#075985;--warn-bg:#FEF3C7;--warn-fg:#92400E;--bad-bg:#FEE2E2;--bad-fg:#991B1B;--ok-bg:#DCFCE7;--ok-fg:#166534;--ai-bg:#F3E8FF;--ai-fg:#6B21A8;--focus:#38BDF8;color-scheme:light}
.app.dark{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;color-scheme:dark}
@media (prefers-color-scheme:dark){.app.system{--bg:#0B1120;--surface:#111A2E;--surface-2:#1A2540;--border:#24314D;--border-2:#36456A;--text:#E5EAF2;--text-2:#CBD5E1;--muted:#9AA8BF;--primary:#38BDF8;--primary-h:#7DD3FC;--on-primary:#062437;--soft:#0C2D48;--soft-fg:#7DD3FC;--warn-bg:#3A2A0A;--warn-fg:#FCD34D;--bad-bg:#3B1218;--bad-fg:#FCA5A5;--ok-bg:#0E2E1C;--ok-fg:#86EFAC;--ai-bg:#2A1645;--ai-fg:#D8B4FE;--focus:#7DD3FC;color-scheme:dark}}
a{color:var(--primary)}a:hover{color:var(--primary-h)}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:15px;transition:background .15s ease}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--soft);color:var(--soft-fg);font-weight:600}
.b{cursor:pointer;font-family:inherit;text-decoration:none;transition:background .15s ease,border-color .15s ease}
.bp{background:var(--primary);color:var(--on-primary);border:0}.bp:hover{background:var(--primary-h);color:var(--on-primary)}
.bs{background:var(--surface);color:var(--text);border:1px solid var(--border-2)}.bs:hover{background:var(--surface-2);color:var(--text)}
.row:hover{background:var(--surface-2)}
input,select,textarea{font-family:inherit}
.fld{height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:14px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
th,td{white-space:nowrap}
@media (max-width:820px){.nav{flex-direction:row!important;flex-wrap:wrap}.sfoot{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<template id="dc">

<div class="app {{themeClass}}" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
      <div aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">ATS</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-weight: 700; font-size: 16px">Talent ATS</span>
        <span style="font-size: 12px; color: var(--muted)">Recruiter pilot · v1.2</span>
      </div>
    </div>
    <nav class="nav" aria-label="Main" style="display: flex; flex-direction: column; gap: 4px">
      <a href="index.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Vacancies</a>
      <a href="candidate.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21a6 6 0 0 0-4-5.6"></path></svg>Candidates</a>
      <a class="on" href="reports.html" aria-current="page"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg>Reports</a>
      <a href="jd-bank.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 11h6M9 15h6"></path></svg>JD Bank</a>
      <a href="backup.html"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg>Backup &amp; security</a>
    </nav>
    <button class="b bs" onClick="{{toggleTheme}}" style="min-height: 44px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      {{themeLabel}}
    </button>
    <div class="sfoot" style="margin-top: auto; padding: 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; line-height: 1.4">
      <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #22C55E"></span>Local model online</span>
      <span>Data stays on this Mac (localhost)</span>
      <span>Last encrypted backup: today, 02:00</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px clamp(16px, 3vw, 40px) 48px; display: flex; flex-direction: column; gap: 22px">

    <header style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Reports</h1>
        <p style="margin: 0; font-size: 15px; color: var(--muted); max-width: 720px">Calculated from the append-only Stage Event log, in calendar days. Pilot month 1 sets the baseline — no targets yet.</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="b bs" style="height: 44px; padding: 0 14px; border-radius: 10px; font-weight: 600; font-size: 14px">Import vacancy</button>
        <button class="b bp" style="height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>
          Export all as CSV
        </button>
      </div>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span id="entl" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Entity</span>
        <div role="group" aria-labelledby="entl" style="display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px">
          <sc-for list="{{entityTabs}}" as="et" hint-placeholder-count="3">
            <button class="b" aria-pressed="{{et.pressed}}" onClick="{{et.pick}}" style="height: 34px; padding: 0 12px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 600; background: {{et.bg}}; color: {{et.fg}}">{{et.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="dep" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Department</label>
        <x-select id="dep" class="fld"><x-option>All departments</x-option><x-option>Offensive Security</x-option><x-option>Security Operations</x-option><x-option>Business Intelligence</x-option><x-option>Academy</x-option><x-option>Sales</x-option></x-select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="per" style="font-size: 13px; font-weight: 600; color: var(--text-2)">Period</label>
        <x-select id="per" class="fld"><x-option>Sep – Nov 2026</x-option><x-option>This month</x-option><x-option>Last 90 days</x-option><x-option>Custom…</x-option></x-select>
      </div>
    </div>

    <section aria-label="Summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: var(--muted); font-weight: 500">{{t.label}}</span>
          <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{t.value}}</span>
          <span style="font-size: 12px; color: var(--muted)">{{t.sub}}</span>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="tth" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline">
        <div>
          <h2 id="tth" style="margin: 0; font-size: 16px; font-weight: 700">Time to Hire</h2>
          <p style="margin: 4px 0 0; font-size: 13px; color: var(--muted)">Applied date → first entry into Agreement, per hired candidate</p>
        </div>
        <button class="b bs" style="height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600">Export CSV</button>
      </div>
      <div style="overflow-x: auto">
        <x-table style="width: 100%; border-collapse: collapse; font-size: 14px">
          <x-thead><x-tr style="text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
            <x-th style="padding: 10px 20px; font-weight: 600">Candidate</x-th><x-th style="padding: 10px 12px; font-weight: 600">Vacancy</x-th><x-th style="padding: 10px 12px; font-weight: 600">Entity</x-th>
            <x-th style="padding: 10px 12px; font-weight: 600">Applied</x-th><x-th style="padding: 10px 12px; font-weight: 600">Agreement</x-th><x-th style="padding: 10px 20px; font-weight: 600; text-align: right">Days</x-th>
          </x-tr></x-thead>
          <x-tbody>
            <sc-for list="{{hires}}" as="h" hint-placeholder-count="4">
              <x-tr class="row" style="border-top: 1px solid var(--border)">
                <x-td style="padding: 12px 20px; font-weight: 600">{{h.name}}</x-td><x-td style="padding: 12px; color: var(--text-2)">{{h.vac}}</x-td><x-td style="padding: 12px; color: var(--text-2)">{{h.ent}}</x-td>
                <x-td style="padding: 12px; color: var(--text-2); font-variant-numeric: tabular-nums">{{h.applied}}</x-td><x-td style="padding: 12px; color: var(--text-2); font-variant-numeric: tabular-nums">{{h.agree}}</x-td>
                <x-td style="padding: 12px 20px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{h.days}}</x-td>
              </x-tr>
            </sc-for>
          </x-tbody>
        </x-table>
      </div>
      <p style="margin: 0; padding: 12px 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border)">Excluded: 1 Failed Post-Agreement (Sales Executive, EB). Backward moves use the first Agreement entry.</p>
    </section>

    <section aria-labelledby="ttf" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline">
        <div>
          <h2 id="ttf" style="margin: 0; font-size: 16px; font-weight: 700">Time to Fill</h2>
          <p style="margin: 4px 0 0; font-size: 13px; color: var(--muted)">First move to Open → each seat reaching Agreement. Closing a vacancy does not stop the clock.</p>
        </div>
        <button class="b bs" style="height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600">Export CSV</button>
      </div>
      <div style="overflow-x: auto">
        <x-table style="width: 100%; border-collapse: collapse; font-size: 14px">
          <x-thead><x-tr style="text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
            <x-th style="padding: 10px 20px; font-weight: 600">Vacancy</x-th><x-th style="padding: 10px 12px; font-weight: 600">Entity</x-th><x-th style="padding: 10px 12px; font-weight: 600">Opened</x-th>
            <x-th style="padding: 10px 12px; font-weight: 600">Seats filled</x-th><x-th style="padding: 10px 12px; font-weight: 600; text-align: right">Average</x-th><x-th style="padding: 10px 12px; font-weight: 600; text-align: right">Longest</x-th>
            <x-th style="padding: 10px 20px; font-weight: 600">Note</x-th>
          </x-tr></x-thead>
          <x-tbody>
            <sc-for list="{{fills}}" as="f" hint-placeholder-count="5">
              <x-tr class="row" style="border-top: 1px solid var(--border)">
                <x-td style="padding: 12px 20px"><div style="font-weight: 600">{{f.vac}}</div><div class="mono" style="font-size: 12px; color: var(--muted)">{{f.code}}</div></x-td>
                <x-td style="padding: 12px; color: var(--text-2)">{{f.ent}}</x-td><x-td style="padding: 12px; color: var(--text-2); font-variant-numeric: tabular-nums">{{f.opened}}</x-td>
                <x-td style="padding: 12px; font-weight: 600">{{f.seats}}</x-td>
                <x-td style="padding: 12px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{f.avg}}</x-td>
                <x-td style="padding: 12px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2)">{{f.longest}}</x-td>
                <x-td style="padding: 12px 20px; font-size: 13px; color: {{f.noteFg}}">{{f.note}}</x-td>
              </x-tr>
            </sc-for>
          </x-tbody>
        </x-table>
      </div>
      <p style="margin: 0; padding: 12px 20px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border)">Cancelled vacancies are excluded. Postponed periods are recorded so either pause rule can be applied once decided.</p>
    </section>

    <section aria-labelledby="dro" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
      <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline">
        <div>
          <h2 id="dro" style="margin: 0; font-size: 16px; font-weight: 700">Drop-off by stage and reason</h2>
          <p style="margin: 4px 0 0; font-size: 13px; color: var(--muted)">Count of outcomes set by recruiters</p>
        </div>
        <button class="b bs" style="height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600">Export CSV</button>
      </div>
      <div style="overflow-x: auto">
        <x-table style="width: 100%; border-collapse: collapse; font-size: 14px">
          <x-thead><x-tr style="text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
            <x-th style="padding: 10px 20px; font-weight: 600">Stage</x-th><x-th style="padding: 10px 12px; font-weight: 600">Outcome</x-th><x-th style="padding: 10px 12px; font-weight: 600">Reason</x-th><x-th style="padding: 10px 20px; font-weight: 600; text-align: right">Count</x-th>
          </x-tr></x-thead>
          <x-tbody>
            <sc-for list="{{drops}}" as="d" hint-placeholder-count="6">
              <x-tr class="row" style="border-top: 1px solid var(--border)">
                <x-td style="padding: 12px 20px; font-weight: 600">{{d.stage}}</x-td>
                <x-td style="padding: 12px"><span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: {{d.bg}}; color: {{d.fg}}">{{d.outcome}}</span></x-td>
                <x-td style="padding: 12px; color: var(--text-2)">{{d.reason}}</x-td>
                <x-td style="padding: 12px 20px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{d.count}}</x-td>
              </x-tr>
            </sc-for>
          </x-tbody>
        </x-table>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"theme":{"editor":"enum","options":["system","light","dark"],"default":"system","section":"Appearance"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null, entity: 'all' };
  }
  themeVals() {
    var self = this;
    var theme = this.state.theme || this.props.theme || 'system';
    var sysDark = false;
    try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    var isDark = theme === 'dark' || (theme === 'system' && sysDark);
    return {
      themeClass: theme, isDark: isDark, isLight: !isDark,
      themeLabel: isDark ? 'Light mode' : 'Dark mode',
      toggleTheme: function () { self.setState({ theme: isDark ? 'light' : 'dark' }); }
    };
  }
  renderVals() {
    var self = this;
    var ent = this.state.entity;
    var keep = function (r) { return ent === 'all' || r.ent === ent; };
    var hires = [
      { name: 'Clara Lim', vac: 'Data Analyst', ent: 'EA', applied: '02 Oct 2026', agree: '30 Oct 2026', days: 28 },
      { name: 'Yudi Saputra', vac: 'SOC Analyst L1', ent: 'EA', applied: '15 Sep 2026', agree: '21 Oct 2026', days: 36 },
      { name: 'Maya Kusuma', vac: 'Sales Executive', ent: 'EB', applied: '01 Sep 2026', agree: '24 Sep 2026', days: 23 },
      { name: 'Andre Wijaya', vac: 'Sales Executive', ent: 'EB', applied: '04 Sep 2026', agree: '06 Oct 2026', days: 32 }
    ].filter(keep);
    var fills = [
      { vac: 'Data Analyst', code: 'JP-EA-BI-007', ent: 'EA', opened: '07 Oct 2026', seats: '1 of 1', avg: '23', longest: '23', note: 'All seats filled', noteFg: 'var(--ok-fg)', filledDays: [23] },
      { vac: 'SOC Analyst L1', code: 'JP-EA-SOC-011', ent: 'EA', opened: '29 Sep 2026', seats: '1 of 3', avg: '22', longest: '22', note: '2 seats still open (41 days)', noteFg: 'var(--warn-fg)', filledDays: [22] },
      { vac: 'Penetration Tester', code: 'JP-EA-SEC-004', ent: 'EA', opened: '22 Oct 2026', seats: '0 of 2', avg: '—', longest: '—', note: '2 seats open (18 days)', noteFg: 'var(--muted)', filledDays: [] },
      { vac: 'Sales Executive', code: 'JP-EB-SLS-001', ent: 'EB', opened: '06 Sep 2026', seats: '2 of 2', avg: '25.5', longest: '30', note: 'Seat 2 reopened once (Failed Post-Agreement)', noteFg: 'var(--muted)', filledDays: [21, 30] },
      { vac: 'Curriculum Developer', code: 'JP-EB-ACD-005', ent: 'EB', opened: '18 Sep 2026', seats: '0 of 1', avg: '—', longest: '—', note: 'Postponed 14 days (recorded)', noteFg: 'var(--warn-fg)', filledDays: [] }
    ].filter(keep);
    var oc = {
      Rejected: ['var(--bad-bg)', 'var(--bad-fg)'], Withdrawn: ['var(--surface-2)', 'var(--text-2)'],
      'Offer Declined': ['var(--warn-bg)', 'var(--warn-fg)'], 'Failed Post-Agreement': ['var(--ai-bg)', 'var(--ai-fg)']
    };
    var drops = [
      { stage: 'Screening', outcome: 'Rejected', reason: 'Does not meet must-have requirements', count: 7, ent: 'EA' },
      { stage: 'Screening', outcome: 'Withdrawn', reason: 'Not responding', count: 2, ent: 'EB' },
      { stage: 'HR Interview', outcome: 'Withdrawn', reason: 'Accepted another offer', count: 2, ent: 'EA' },
      { stage: 'Technical Assessment', outcome: 'Rejected', reason: 'Failed technical assessment', count: 3, ent: 'EA' },
      { stage: 'Offering & Negotiation', outcome: 'Offer Declined', reason: 'Compensation', count: 1, ent: 'EA' },
      { stage: 'MCU', outcome: 'Failed Post-Agreement', reason: 'Did not pass MCU', count: 1, ent: 'EB' }
    ].filter(keep).map(function (d) { return Object.assign({}, d, { bg: oc[d.outcome][0], fg: oc[d.outcome][1] }); });

    var avg = function (arr) { return arr.length ? (arr.reduce(function (a, b) { return a + b; }, 0) / arr.length).toFixed(1) : '—'; };
    var seatDays = [];
    fills.forEach(function (f) { seatDays = seatDays.concat(f.filledDays); });
    var seg = function (on) { return on ? { bg: 'var(--surface)', fg: 'var(--text)', pressed: 'true' } : { bg: 'transparent', fg: 'var(--muted)', pressed: 'false' }; };
    return Object.assign(this.themeVals(), {
      entityTabs: [['all', 'All entities'], ['EA', 'Entity A (EA)'], ['EB', 'Entity B (EB)']].map(function (e) {
        return Object.assign({ label: e[1], pick: function () { self.setState({ entity: e[0] }); } }, seg(ent === e[0]));
      }),
      tiles: [
        { label: 'Avg Time to Hire', value: avg(hires.map(function (h) { return h.days; })) + ' d', sub: hires.length + ' hired candidates' },
        { label: 'Avg Time to Fill (filled seats)', value: avg(seatDays) + ' d', sub: seatDays.length + ' seats filled' },
        { label: 'Drop-offs recorded', value: String(drops.reduce(function (a, d) { return a + d.count; }, 0)), sub: 'All with a reason' },
        { label: 'Stage data completeness', value: '92%', sub: 'Updated within 2 working days · target 90%' }
      ],
      hires: hires,
      fills: fills,
      drops: drops
    });
  }
}
</script>
